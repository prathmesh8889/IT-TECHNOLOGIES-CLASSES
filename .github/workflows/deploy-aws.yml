name: Deploy to AWS Lightsail

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: itcyber-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy latest main to Lightsail
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          port: ${{ secrets.AWS_PORT }}
          script_stop: true
          script: |
            /usr/local/bin/deploy-itcyber
            curl -fsS http://127.0.0.1:3000/api/site-data >/dev/null
            curl -fsS https://training.itcyber.in/ >/dev/null
            curl -fsS https://training.itcyber.in/admin.html >/dev/null
            echo "AWS DEPLOY VERIFIED"
