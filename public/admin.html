<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Login | IT Cyber Technology</title><link rel="stylesheet" href="styles.css"><style>.auth-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(circle at 25% 15%,rgba(79,70,229,.25),transparent 30%),radial-gradient(circle at 80% 75%,rgba(6,182,212,.18),transparent 28%),#07111f}.auth-card{width:min(430px,100%);padding:30px;border-radius:22px;background:rgba(255,255,255,.96);box-shadow:0 30px 80px rgba(0,0,0,.32)}.auth-card h1{margin:10px 0 8px}.auth-card p{color:#64748b}.auth-card label{display:grid;gap:7px;margin:16px 0;font-weight:700;font-size:13px}.auth-card input{width:100%;padding:13px;border:1px solid #cbd5e1;border-radius:11px;font:inherit}.auth-card input:focus{outline:0;border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.1)}.auth-msg{min-height:20px;color:#b91c1c;font-size:13px}.auth-back{display:inline-block;margin-top:16px;color:#4f46e5;font-weight:700}</style></head><body><main class="auth-page"><form class="auth-card" id="adminLogin"><span class="brand-mark">ICT</span><h1>Admin Login</h1><p>Secure access for IT Cyber Technology administration.</p><label>Admin ID<input name="username" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button class="btn primary full" type="submit">Secure Login</button><p class="auth-msg" id="authMsg"></p><a class="auth-back" href="index.html">← Back to website</a></form></main><script>const f=document.getElementById("adminLogin"),m=document.getElementById("authMsg");f.addEventListener("submit",async e=>{e.preventDefault();m.textContent="Signing in…";const d=Object.fromEntries(new FormData(f));try{const r=await fetch("/api/admin/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});if(!r.ok)throw 0;location.href="/admin/dashboard"}catch(_){m.textContent="Invalid credentials or authentication service unavailable."}});</script></body></html>
