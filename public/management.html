<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management | ICT Admin</title><link rel="stylesheet" href="styles.css"></head><body class="admin-body"><div class="admin-shell"><div class="admin-top"><div><h1>ICT Management</h1><p>Courses • Batches • Fees • Students</p></div><a class="btn primary" href="admin.html">Enquiries & Payments</a></div><section id="login" class="login-card"><h2>Admin Login</h2><form id="loginForm" class="enquiry-form simple-form"><label>Username<input id="u" required></label><label>Password<input id="p" type="password" required></label><button class="btn primary full">Login</button><p id="msg"></p></form></section><main id="panel" hidden><div id="stats" class="stat-strip"></div><div class="feature-grid" style="margin-top:24px"><form id="courseForm" class="enquiry-form"><h2>Add Course</h2><label>Name<input name="name" required></label><div class="field-row"><label>Duration<input name="duration" required></label><label>Fee ₹<input name="fee" type="number" required></label></div><label>Description<textarea name="description"></textarea></label><button class="btn primary">Add Course</button></form><form id="batchForm" class="enquiry-form"><h2>Add Batch</h2><label>Course<select name="courseId" id="batchCourse" required></select></label><label>Batch Name<input name="name" required placeholder="Morning A"></label><div class="field-row"><label>Mode<select name="mode"><option>Offline</option><option>Online</option><option>Hybrid</option></select></label><label>Time<input name="startTime" placeholder="8:00 AM"></label></div><div class="field-row"><label>Start Date<input type="date" name="startDate"></label><label>Capacity<input type="number" name="capacity" value="30"></label></div><button class="btn primary">Add Batch</button></form><form id="studentForm" class="enquiry-form"><h2>Add Student</h2><label>Name<input name="name" required></label><div class="field-row"><label>Phone<input name="phone" required></label><label>Email<input name="email" type="email"></label></div><label>Course<select name="courseId" id="studentCourse"></select></label><label>Batch<select name="batchId" id="studentBatch"><option value="">No batch</option></select></label><button class="btn primary">Add Student</button></form></div><section class="section"><h2>Courses & Fees</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Course</th><th>Duration</th><th>Fee</th><th>Status</th><th>Action</th></tr></thead><tbody id="courses"></tbody></table></div><h2 style="margin-top:30px">Batches</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Batch</th><th>Course</th><th>Mode</th><th>Time</th><th>Capacity</th><th>Action</th></tr></thead><tbody id="batches"></tbody></table></div><h2 style="margin-top:30px">Students</h2><div class="admin-table-wrap"><table class="admin-table"><thead><tr><th>Student</th><th>Phone</th><th>Course</th><th>Batch</th><th>Admission</th><th>Fee</th><th>Action</th></tr></thead><tbody id="students"></tbody></table></div></section></main></div><script src="management.js"></script></body></html>
